name: smart-port-airflow

x-airflow-common: &airflow-common
  image: smart-port/airflow:3.3.0
  build:
    context: ./infra/airflow
  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped
  environment: &airflow-common-env
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-mxoQB6nz-LXwrWWp7xT5hEL08SC7Fsct_QHJka7GY4A=}
    # Airflow 3 Execution API tokens must be signed and validated with one
    # shared key across the scheduler, task workers, and API server.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET:?AIRFLOW_API_AUTH_JWT_SECRET must be set}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/airflow
    AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_PORT:-8080}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    SMART_PORT_S3_ENDPOINT: http://minio:9000
    SMART_PORT_BRONZE_BUCKET: bronze-maritime
    SMART_PORT_SILVER_BUCKET: silver-maritime
    SMART_PORT_GOLD_BUCKET: gold-maritime
    SMART_PORT_FEATURE_BUILDER_URL: http://feature-builder:8090
    SMART_PORT_MAX_NETCDF_FILES_PER_RUN: "12"
    SMART_PORT_DB_HOST: timescaledb
    SMART_PORT_DB_PORT: "5432"
    SMART_PORT_DB_NAME: ${POSTGRES_DB}
    SMART_PORT_DB_USER: ${POSTGRES_USER}
    SMART_PORT_DB_PASSWORD: ${POSTGRES_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-config:/opt/airflow/config
  networks:
    - backend

services:
  airflow-db-create:
    image: timescale/timescaledb:2.28.0-pg17
    container_name: spm-airflow-db-create
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/opt/smart-port/create-airflow-db.sh"]
    volumes:
      - ./infra/airflow/create-airflow-db.sh:/opt/smart-port/create-airflow-db.sh:ro
    networks:
      - backend

  airflow-init:
    <<: *airflow-common
    container_name: spm-airflow-init
    restart: "no"
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate"]
    depends_on:
      airflow-db-create:
        condition: service_completed_successfully

  airflow-api-server:
    <<: *airflow-common
    container_name: spm-airflow-api-server
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  airflow-scheduler:
    <<: *airflow-common
    container_name: spm-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: spm-airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    container_name: spm-airflow-triggerer
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --local"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s

networks:
  backend:
    external: true
    name: smart-port-backend

volumes:
  airflow-logs:
    name: smart-port-airflow-logs
  airflow-config:
    name: smart-port-airflow-config
